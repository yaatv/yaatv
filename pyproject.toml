[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yaatv"
dynamic = [
  "version",
]
description = "Yet Another Audio To Video: combine audio and cover art into a YouTube-ready video."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = [
  "LICENSE",
]
authors = [
  { name = "cavyion" }
]
dependencies = [
  "mutagen>=1.47",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.7",
  "build>=1.2",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pip-licenses>=4.0",
  "pytest>=8.0",
  "ruff>=0.8",
  "twine>=5.1"
]

[project.scripts]
yaatv = "yaatv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "yaatv.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that run external tools such as FFmpeg"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP"
]

[tool.mypy]
python_version = "3.11"
files = ["src/yaatv"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["assets", "build", "dist", "tests"]
skips = []
