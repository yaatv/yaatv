name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Smoke test CLI
        run: |
          yaatv --version
          python -m yaatv --version
          yaatv --help
          python -m yaatv --help

      - name: Run quality gates
        if: matrix.python-version == '3.11'
        run: python scripts/check.py --quality-only

      - name: Run unit tests
        run: python -m pytest -m "not integration"

      - name: Build package and check metadata
        if: matrix.python-version == '3.11'
        run: python scripts/check.py --build-only

      - name: Smoke test built wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m pip uninstall -y yaatv
          python -m pip install dist/*.whl
          smoke_dir="${RUNNER_TEMP}/yaatv-wheel-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          yaatv --version
          yaatv --help

  os:
    name: OS compatibility on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Smoke test CLI
        run: |
          yaatv --version
          python -m yaatv --version
          yaatv --help
          python -m yaatv --help

      - name: Run tests
        run: python -m pytest
