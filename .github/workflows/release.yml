name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Pre-release verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify release commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Error: Release commit ${GITHUB_SHA} is not reachable from origin/main." >&2
            exit 1
          fi
          echo "Commit ${GITHUB_SHA} is verified on origin/main."

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from yaatv import __version__
          print(__version__)
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package version $package_version."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run security and quality gates
        run: python scripts/check.py --quality-only

      - name: Run tests
        run: python -m pytest

  build:
    name: Build ${{ matrix.package_name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package_name: yaatv-windows-x64
            executable_name: yaatv
            extension: .exe
            single_file_name: yaatv-windows-x64.exe
          - os: ubuntu-latest
            package_name: yaatv-linux-x64
            executable_name: yaatv-linux
            extension: ""
            single_file_name: yaatv-linux-x64
          - os: macos-15-intel
            package_name: yaatv-macos-x64
            executable_name: yaatv-macos
            extension: ""
            single_file_name: yaatv-macos-x64
          - os: macos-15
            package_name: yaatv-macos-arm64
            executable_name: yaatv-macos-arm64
            extension: ""
            single_file_name: yaatv-macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from yaatv import __version__
          print(__version__)
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if ! python -m pip install -r requirements-release.txt; then
            echo "Could not resolve the pinned release dependencies in requirements-release.txt." >&2
            exit 1
          fi
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check

      - name: Smoke test CLI
        run: |
          yaatv --version
          python -m yaatv --version

      - name: Prepare FFmpeg release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > FFMPEG_BUILD_INFO.txt
          import os
          import platform

          from yaatv.cli import (
              LINUX_FFMPEG_ARCHIVE_SHA256,
              LINUX_FFMPEG_ARCHIVE_URL,
              LINUX_FFPROBE_ARCHIVE_SHA256,
              LINUX_FFPROBE_ARCHIVE_URL,
              MACOS_ARM64_FFMPEG_ARCHIVE_SHA256,
              MACOS_ARM64_FFMPEG_ARCHIVE_URL,
              MACOS_ARM64_FFPROBE_ARCHIVE_SHA256,
              MACOS_ARM64_FFPROBE_ARCHIVE_URL,
              MACOS_FFMPEG_ARCHIVE_SHA256,
              MACOS_FFMPEG_ARCHIVE_URL,
              MACOS_FFPROBE_ARCHIVE_SHA256,
              MACOS_FFPROBE_ARCHIVE_URL,
              WINDOWS_FFMPEG_ARCHIVE_SHA256,
              WINDOWS_FFMPEG_ARCHIVE_URL,
          )

          runner_os = os.environ["RUNNER_OS"]

          print("The yaatv release executable does not bundle FFmpeg or FFprobe.")
          print("Run yaatv --install-ffmpeg to install the app-managed FFmpeg tools.")
          print()
          print(f"Runner OS: {runner_os}")

          if runner_os == "Windows":
              print(f"Installer archive source: {WINDOWS_FFMPEG_ARCHIVE_URL}")
              print(f"Installer archive sha256: {WINDOWS_FFMPEG_ARCHIVE_SHA256}")
              print(r"Install path: %LOCALAPPDATA%\yaatv\bin")
              print("Extracted files: ffmpeg.exe, ffprobe.exe")
          elif runner_os == "Linux":
              print(f"Installer ffmpeg source: {LINUX_FFMPEG_ARCHIVE_URL}")
              print(f"Installer ffmpeg sha256: {LINUX_FFMPEG_ARCHIVE_SHA256}")
              print(f"Installer ffprobe source: {LINUX_FFPROBE_ARCHIVE_URL}")
              print(f"Installer ffprobe sha256: {LINUX_FFPROBE_ARCHIVE_SHA256}")
              print("Install path: $XDG_DATA_HOME/yaatv/bin, or ~/.local/share/yaatv/bin")
              print("Extracted files: ffmpeg, ffprobe")
          elif runner_os == "macOS":
              if platform.machine().lower() in {"arm64", "aarch64"}:
                  print(f"Installer ffmpeg source: {MACOS_ARM64_FFMPEG_ARCHIVE_URL}")
                  print(f"Installer ffmpeg sha256: {MACOS_ARM64_FFMPEG_ARCHIVE_SHA256}")
                  print(f"Installer ffprobe source: {MACOS_ARM64_FFPROBE_ARCHIVE_URL}")
                  print(f"Installer ffprobe sha256: {MACOS_ARM64_FFPROBE_ARCHIVE_SHA256}")
              else:
                  print(f"Installer ffmpeg source: {MACOS_FFMPEG_ARCHIVE_URL}")
                  print(f"Installer ffmpeg sha256: {MACOS_FFMPEG_ARCHIVE_SHA256}")
                  print(f"Installer ffprobe source: {MACOS_FFPROBE_ARCHIVE_URL}")
                  print(f"Installer ffprobe sha256: {MACOS_FFPROBE_ARCHIVE_SHA256}")
              print("Install path: ~/Library/Application Support/yaatv/bin")
              print("Extracted files: ffmpeg, ffprobe")
          else:
              raise SystemExit(f"Unsupported runner OS: {runner_os}")

          print()
          print("FFmpeg project source: https://git.ffmpeg.org/ffmpeg.git")
          print("FFmpeg legal information: https://ffmpeg.org/legal.html")
          PY

      - name: Build executable
        shell: bash
        run: |
          python scripts/generate_licenses.py -o THIRD_PARTY_LICENSES.txt
          python -c "from pathlib import Path; Path('yaatv_launcher.py').write_text('from yaatv.cli import main\nraise SystemExit(main())\n', encoding='utf-8')"
          mkdir -p dist/onedir dist/onefile build/onedir build/onefile build/work/onedir build/work/onefile build/spec/onedir build/spec/onefile
          separator=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            separator=";"
          fi
          common_args=(
            --noconfirm
            --add-data "THIRD_PARTY_LICENSES.txt${separator}."
            --add-data "FFMPEG_BUILD_INFO.txt${separator}."
            --exclude-module numpy
            yaatv_launcher.py
          )
          printf 'pyinstaller-onedir\n' > build/onedir/yaatv-distribution.txt
          pyinstaller \
            --onedir \
            --name "${{ matrix.executable_name }}${{ matrix.extension }}" \
            --distpath dist/onedir \
            --workpath build/work/onedir \
            --specpath build/spec/onedir \
            --add-data "build/onedir/yaatv-distribution.txt${separator}." \
            "${common_args[@]}"
          printf 'pyinstaller-onefile\n' > build/onefile/yaatv-distribution.txt
          pyinstaller \
            --onefile \
            --name "${{ matrix.single_file_name }}" \
            --distpath dist/onefile \
            --workpath build/work/onefile \
            --specpath build/spec/onefile \
            --add-data "build/onefile/yaatv-distribution.txt${separator}." \
            "${common_args[@]}"

      - name: Smoke test executable
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              executable="dist/onedir/${{ matrix.executable_name }}.exe/${{ matrix.executable_name }}.exe"
              ;;
            *)
              executable="dist/onedir/${{ matrix.executable_name }}/${{ matrix.executable_name }}"
              ;;
          esac
          python - <<'PY'
          import math
          import struct
          import wave
          from PIL import Image

          duration = 3
          sample_rate = 48000
          frame_count = duration * sample_rate
          with wave.open("smoke-audio.wav", "wb") as audio:
              audio.setnchannels(2)
              audio.setsampwidth(2)
              audio.setframerate(sample_rate)
              frames = bytearray()
              for index in range(frame_count):
                  sample = int(32767 * 0.2 * math.sin(2 * math.pi * 440 * index / sample_rate))
                  packed = struct.pack("<h", sample)
                  frames.extend(packed)
                  frames.extend(packed)
              audio.writeframes(frames)

          Image.new("RGB", (320, 240), (24, 84, 128)).save("smoke-image.png", "PNG")
          PY
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "$executable"
          fi
          "$executable" --version
          case "$RUNNER_OS" in
            Windows)
              mkdir -p smoke-localappdata
              export LOCALAPPDATA="$(cygpath -w "$PWD/smoke-localappdata")"
              ;;
            Linux)
              mkdir -p smoke-xdg-data
              export XDG_DATA_HOME="$PWD/smoke-xdg-data"
              ;;
            macOS)
              mkdir -p smoke-home
              export HOME="$PWD/smoke-home"
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          "$executable" --install-ffmpeg
          "$executable" \
            --audio smoke-audio.wav \
            --image smoke-image.png \
            --output smoke-output.mp4 \
            --resolution 1080p \
            --no-warn

      - name: Smoke test onefile executable
        shell: bash
        run: |
          set -euo pipefail
          executable="dist/onefile/${{ matrix.single_file_name }}"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "$executable"
          fi
          "$executable" --version
          "$executable" --help >/dev/null
          "$executable" \
            --audio smoke-audio.wav \
            --image smoke-image.png \
            --output onefile-smoke-output.mp4 \
            --dry-run \
            --no-warn

      - name: Assemble release package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="package/${{ matrix.package_name }}"
          single_file_dir="package/${{ matrix.package_name }}-single-file"
          notices_dir="package/${{ matrix.package_name }}-notices"
          mkdir -p "$package_dir" "$single_file_dir" "$notices_dir" release-assets
          onedir_root="dist/onedir/${{ matrix.executable_name }}${{ matrix.extension }}"
          single_file="dist/onefile/${{ matrix.single_file_name }}"
          cp -a "$onedir_root"/. "$package_dir/"
          cp "$single_file" "$single_file_dir/"
          cp "$single_file" "release-assets/${{ matrix.single_file_name }}"
          python - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ.get("GITHUB_REF_NAME", "main")
          source_notice = (
              "yaatv Source Code Notice\n"
              "========================\n\n"
              "yaatv is free software licensed under the GNU General Public License version 2\n"
              "or (at your option) any later version (GPL-2.0-or-later).\n\n"
              "In accordance with the GNU General Public License, the exact corresponding source code\n"
              "for this binary release (including source files, build workflows, and packaging scripts)\n"
              "can be obtained from the yaatv repository:\n\n"
              f"  https://github.com/yaatv/yaatv/tree/{tag}\n"
              f"  https://github.com/yaatv/yaatv/releases/tag/{tag}\n\n"
              "To clone the source repository:\n\n"
              "  git clone https://github.com/yaatv/yaatv.git\n"
              "  cd yaatv\n"
              f"  git checkout {tag}\n\n"
              "Full license text for yaatv is provided in LICENSE.\n"
              "Licenses and copyright notices for bundled third-party dependencies are provided in THIRD_PARTY_LICENSES.txt.\n"
          )
          Path("SOURCE.txt").write_text(source_notice, encoding="utf-8")
          PY
          cp LICENSE THIRD_PARTY_LICENSES.txt FFMPEG_BUILD_INFO.txt SOURCE.txt "$package_dir/"
          cp LICENSE THIRD_PARTY_LICENSES.txt FFMPEG_BUILD_INFO.txt SOURCE.txt "$single_file_dir/"
          cp LICENSE THIRD_PARTY_LICENSES.txt FFMPEG_BUILD_INFO.txt SOURCE.txt "$notices_dir/"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: package/${{ matrix.package_name }}
          format: spdx-json
          output-file: release-assets/${{ matrix.package_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate single-file SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: package/${{ matrix.package_name }}-single-file
          format: spdx-json
          output-file: release-assets/${{ matrix.package_name }}-single-file.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Package release ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("package") / "${{ matrix.package_name }}"
          output = Path("release-assets") / "${{ matrix.package_name }}.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY

      - name: Package single-file notices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("package") / "${{ matrix.package_name }}-notices"
          output = Path("release-assets") / "${{ matrix.package_name }}-notices.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY

      - name: Verify release package and SBOM
        shell: bash
        run: |
          set -euo pipefail
          zip_file="release-assets/${{ matrix.package_name }}.zip"
          single_file="release-assets/${{ matrix.single_file_name }}"
          notices_file="release-assets/${{ matrix.package_name }}-notices.zip"
          zip_sbom="release-assets/${{ matrix.package_name }}.spdx.json"
          single_file_sbom="release-assets/${{ matrix.package_name }}-single-file.spdx.json"
          for artifact in "$zip_file" "$single_file" "$notices_file" "$zip_sbom" "$single_file_sbom"; do
            if [[ ! -s "$artifact" ]]; then
              echo "Error: Missing or empty release artifact: $artifact" >&2
              exit 1
            fi
          done
          echo "Verified both executable formats, notices, and SBOMs."

      - name: Upload release package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package_name }}
          path: |
            release-assets/${{ matrix.package_name }}.zip
            release-assets/${{ matrix.single_file_name }}
            release-assets/${{ matrix.package_name }}-notices.zip
            release-assets/${{ matrix.package_name }}.spdx.json
            release-assets/${{ matrix.package_name }}-single-file.spdx.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum *.zip *.spdx.json *.exe yaatv-linux-x64 yaatv-macos-x64 yaatv-macos-arm64 | sort -k2 > SHA256SUMS)

      - name: Sign and verify checksums with PGP
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail

          : "${PGP_PRIVATE_KEY:?Set the PGP_PRIVATE_KEY secret in the release environment.}"

          gpg_home="$(mktemp -d "${RUNNER_TEMP:-/tmp}/yaatv-release-gpg.XXXXXX")"
          chmod 700 "$gpg_home"
          export GNUPGHOME="$gpg_home"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf -- "$GNUPGHOME"' EXIT

          printf '%s\n' "$PGP_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --import public.key

          expected_fingerprint="$(gpg --batch --show-keys --with-colons public.key | awk -F: '$1 == "fpr" && !fingerprint { fingerprint = $10 } END { print fingerprint }')"
          if [[ -z "$expected_fingerprint" ]]; then
            echo "Error: public.key does not contain a readable PGP key." >&2
            exit 1
          fi
          if ! gpg --batch --list-secret-keys "$expected_fingerprint" >/dev/null 2>&1; then
            echo "Error: PGP_PRIVATE_KEY does not match the key in public.key." >&2
            exit 1
          fi

          if [[ -n "${PGP_PASSPHRASE:-}" ]]; then
            printf '%s\n' "$PGP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$expected_fingerprint" --armor --detach-sign \
              --output release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          else
            gpg --batch --yes --local-user "$expected_fingerprint" --armor --detach-sign \
              --output release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          fi

          gpg --batch --verify release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          echo "Created and verified SHA256SUMS.asc with the key in public.key."

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --generate-notes --title "$TAG_NAME"
          fi
